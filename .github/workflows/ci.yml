name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://reconcile:reconcile@localhost:5432/reconcile
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reconcile
          POSTGRES_USER: reconcile
          POSTGRES_PASSWORD: reconcile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reconcile -d reconcile"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test -z "$(git ls-files 'packages/*/src/*.js' 'packages/*/src/*.d.ts' 'packages/*/src/*.map')"
        name: no committed build artifacts
      - run: pnpm -r --filter './packages/*' build
        name: build packages (types needed by dependents)
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
